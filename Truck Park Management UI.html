<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Park Management - UI Preview (Milestone 1)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styling for liquid glass, specular sheen, and ambient light pools -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.65)',
                            dark: 'rgba(15, 23, 42, 0.65)',
                            borderLight: 'rgba(255, 255, 255, 0.4)',
                            borderDark: 'rgba(255, 255, 255, 0.1)',
                        },
                        status: {
                            success: '#10b981',
                            info: '#3b82f6',
                            warning: '#f59e0b',
                            critical: '#ef4444',
                            neutral: '#64748b',
                            offline: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ambient Background Light Pools */
        .ambient-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .light-pool-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(40px);
        }
        .light-pool-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(50px);
        }

        /* Liquid Glass Card Layering */
        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07),
                        inset 0 0 12px 0 rgba(255, 255, 255, 0.4);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                        inset 0 0 12px 0 rgba(255, 255, 255, 0.03);
        }

        /* Specular Sheen (Diagonal Shine Overlay) */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 55%
            );
            pointer-events: none;
            transform: rotate(25deg);
        }

        /* Bottom Accent Glow */
        .glass-card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 10%;
            width: 80%;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.3) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            filter: blur(8px);
        }

        /* Geometric outline icons accent dots */
        .icon-accent-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: #38bdf8;
            border-radius: 50%;
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300">

    <!-- Ambient background light pools -->
    <div class="ambient-bg">
        <div class="light-pool-1"></div>
        <div class="light-pool-2"></div>
    </div>

    <div class="min-h-full flex flex-col relative z-10">

        <!-- Top Controls Bar -->
        <header class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 sticky top-0 z-30">
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md">

                    </div>
                    <div>
                        <h1 class="font-bold text-slate-900 dark:text-white leading-none">Truck Park Management</h1>

                <!-- Viewport & Device Controls -->

                    <button id="viewTablet" onclick="setDeviceView('tablet')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        Tablet / Wide (Navigation Rail)
                    </button>

            </div>
        </header>

        <!-- Main Workspace -->
        <main class="flex-1 flex items-center justify-center p-4 md:p-8">
            
            <!-- Phone Container Frame -->
            <div id="appContainer" class="w-full max-w-sm h-[740px] rounded-[40px] border-[10px] border-slate-800 dark:border-slate-900 shadow-2xl overflow-hidden flex flex-col relative bg-slate-50 dark:bg-slate-900 transition-all duration-300">
                
                <!-- Status Bar Mock -->
                <div class="h-6 bg-slate-200/50 dark:bg-slate-950/50 px-5 flex justify-between items-center text-[10px] font-semibold text-slate-600 dark:text-slate-400 select-none z-20">
                    <span>09:41</span>
                    <div class="flex items-center space-x-1.5">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.2 19.54 10.55 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                    </div>
                </div>

                <!-- Slide-over Drawer / Menu for 'More' & Theme Options -->
                <div id="moreDrawer" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm z-40 hidden transition-opacity opacity-0 duration-300 flex justify-end">
                    <div id="drawerPanel" class="w-4/5 h-full bg-slate-100/90 dark:bg-slate-900/90 backdrop-blur-xl border-l border-slate-200/50 dark:border-slate-800/50 p-4 flex flex-col justify-between transform translate-x-full transition-transform duration-300">
                        <div class="space-y-4">
                            <!-- Drawer Header -->
                            <div class="flex items-center justify-between pb-3 border-b border-slate-200/60 dark:border-slate-800/60">
                                <div>
                                    <h3 class="text-base font-bold text-slate-900 dark:text-white">More Options</h3>
                                    <p class="text-[10px] text-slate-500 dark:text-slate-400">Settings & Appearance</p>
                                </div>
                                <button onclick="toggleMoreDrawer(false)" class="p-1.5 rounded-lg bg-slate-200/50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </div>

                            <!-- Appearance Settings inside Hamburger Drawer -->
                            <div class="glass-card rounded-2xl p-3.5 space-y-3">
                                <div class="flex items-center space-x-2">
                                    <div class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                                    </div>
                                    <h4 class="text-xs font-semibold text-slate-900 dark:text-white">Appearance Theme</h4>
                                </div>

                                <div class="space-y-1.5" id="themePickerContainer">

                        </div>

                        <!-- Drawer Footer -->
                        <div class="text-[10px] text-center text-slate-400 dark:text-slate-500 pt-2 border-t border-slate-200/50 dark:border-slate-800/50">

                    </div>
                </div>

                <!-- Inner App Layout Wrapper -->
                <div id="layoutWrapper" class="flex-1 flex flex-col relative overflow-hidden">
                    
                    <!-- Navigation Rail (Visible in Tablet view) -->
                    <aside id="navRail" class="hidden w-16 bg-white/40 dark:bg-slate-900/40 border-r border-slate-200/50 dark:border-slate-800/50 backdrop-blur-md flex-col items-center py-6 space-y-6 z-20">
                        <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-700 dark:text-slate-300 mb-4">
                            TP
                        </div>
                        <button onclick="switchTab('home')" class="nav-rail-item text-indigo-600 dark:text-indigo-400" data-tab="home">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                        </button>
                        <button onclick="switchTab('visits')" class="nav-rail-item text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400" data-tab="visits">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </button>
                        <button onclick="switchTab('registers')" class="nav-rail-item text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400" data-tab="registers">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        </button>
                        <button onclick="switchTab('reports')" class="nav-rail-item text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400" data-tab="reports">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        </button>
                    </aside>

                    <!-- Main Screen Content Area -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        
                        <!-- Header Section inside app with Top-Right Hamburger Icon -->
                        <div class="flex items-center justify-between pt-2">
                            <div>
                                <h2 id="screenTitle" class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Home</h2>
                                <p class="text-xs text-slate-500 dark:text-slate-400">Truck Park System</p>
                            </div>
                            
                            <div class="flex items-center space-x-2">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                                    <span class="w-1.5 h-1.5 mr-1 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Ready
                                </span>
                                <!-- Top Right Hamburger Icon Button for More/Settings Hub -->
                                <button onclick="toggleMoreDrawer(true)" class="p-2 rounded-xl bg-slate-200/60 dark:bg-slate-800/60 text-slate-700 dark:text-slate-200 hover:bg-slate-300/60 dark:hover:bg-slate-700/60 transition-colors shadow-sm">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path d="M4 6h16M4 12h16M4 18h16"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Dynamic Content Container -->
                        <div id="tabContent" class="space-y-4">
                            <!-- Injected dynamically via JS based on selected tab -->
                        </div>

                    </div>

                    <!-- Bottom Navigation Bar (Visible in Mobile view) -->
                    <nav id="bottomNav" class="h-16 bg-white/60 dark:bg-slate-900/60 backdrop-blur-lg border-t border-slate-200/50 dark:border-slate-800/50 flex justify-around items-center px-2 z-20">
                        <button onclick="switchTab('home')" class="nav-item flex flex-col items-center justify-center w-full h-full text-indigo-600 dark:text-indigo-400" data-tab="home">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                            <span class="text-[10px] mt-1 font-medium">Home</span>
                        </button>
                        <button onclick="switchTab('visits')" class="nav-item flex flex-col items-center justify-center w-full h-full text-slate-500 dark:text-slate-400" data-tab="visits">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <span class="text-[10px] mt-1 font-medium">Visits</span>
                        </button>
                        <button onclick="switchTab('registers')" class="nav-item flex flex-col items-center justify-center w-full h-full text-slate-500 dark:text-slate-400" data-tab="registers">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                            <span class="text-[10px] mt-1 font-medium">Registers</span>
                        </button>
                        <button onclick="switchTab('reports')" class="nav-item flex flex-col items-center justify-center w-full h-full text-slate-500 dark:text-slate-400" data-tab="reports">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span class="text-[10px] mt-1 font-medium">Reports</span>
                        </button>
                    </nav>

                </div>
            </div>

        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State Management
        let currentTab = 'home';
        let appearanceMode = 'system'; // 'system' | 'light' | 'dark'

        // Open/Close top-right Hamburger Drawer for 'More' section
        function toggleMoreDrawer(open) {
            const drawer = document.getElementById('moreDrawer');
            const panel = document.getElementById('drawerPanel');

            if (open) {
                renderThemePicker();
                drawer.classList.remove('hidden');
                setTimeout(() => {
                    drawer.classList.remove('opacity-0');
                    panel.classList.remove('translate-x-full');
                }, 10);
            } else {
                drawer.classList.add('opacity-0');
                panel.classList.add('translate-x-full');
                setTimeout(() => {
                    drawer.classList.add('hidden');
                }, 300);
            }
        }

        function renderThemePicker() {
            const container = document.getElementById('themePickerContainer');
            if (!container) return;

            container.innerHTML = `
                <button onclick="applyAppearance('system')" class="w-full flex items-center justify-between p-2 rounded-xl text-xs font-medium border transition-all ${appearanceMode === 'system' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-300' : 'border-slate-200/60 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100/50 dark:hover:bg-slate-800/50'}">
                    <div class="flex items-center space-x-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <span>System Default</span>
                    </div>
                    ${appearanceMode === 'system' ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>' : ''}
                </button>

                <button onclick="applyAppearance('light')" class="w-full flex items-center justify-between p-2 rounded-xl text-xs font-medium border transition-all ${appearanceMode === 'light' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-300' : 'border-slate-200/60 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100/50 dark:hover:bg-slate-800/50'}">
                    <div class="flex items-center space-x-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        <span>Light Theme</span>
                    </div>
                    ${appearanceMode === 'light' ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>' : ''}
                </button>

                <button onclick="applyAppearance('dark')" class="w-full flex items-center justify-between p-2 rounded-xl text-xs font-medium border transition-all ${appearanceMode === 'dark' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-300' : 'border-slate-200/60 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100/50 dark:hover:bg-slate-800/50'}">
                    <div class="flex items-center space-x-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <span>Dark Theme</span>
                    </div>
                    ${appearanceMode === 'dark' ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>' : ''}
                </button>
            `;
        }

        // Apply appearance according to state
        function applyAppearance(mode) {
            appearanceMode = mode;
            const html = document.documentElement;

            if (mode === 'dark') {
                html.classList.add('dark');
            } else if (mode === 'light') {
                html.classList.remove('dark');
            } else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }

            renderThemePicker();
        }

        // Switch active Navigation Tab
        function switchTab(tab) {
            currentTab = tab;
            
            const titleMap = {
                home: 'Home',
                visits: 'Visits',
                registers: 'Registers',
                reports: 'Reports'
            };
            document.getElementById('screenTitle').innerText = titleMap[tab] || 'Home';

            // Update Active Buttons styles
            document.querySelectorAll('.nav-item, .nav-rail-item').forEach(btn => {
                const btnTab = btn.getAttribute('data-tab');
                if (btnTab === tab) {
                    btn.classList.add('text-indigo-600', 'dark:text-indigo-400');
                    btn.classList.remove('text-slate-500', 'dark:text-slate-400');
                } else {
                    btn.classList.remove('text-indigo-600', 'dark:text-indigo-400');
                    btn.classList.add('text-slate-500', 'dark:text-slate-400');
                }
            });

            renderTabContent();
        }

        // Render tab content inside app frame
        function renderTabContent() {
            const container = document.getElementById('tabContent');

            container.innerHTML = `
                <!-- Status Badges Showcase Card -->
                <div class="glass-card rounded-2xl p-4 space-y-3">
                    <h4 class="text-xs font-semibold text-slate-700 dark:text-slate-300">Design System Status Badges</h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="flex items-center space-x-1.5 p-2 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="font-medium">Success Badge</span>
                        </div>
                        <div class="flex items-center space-x-1.5 p-2 rounded-lg bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span class="font-medium">Info Badge</span>
                        </div>
                        <div class="flex items-center space-x-1.5 p-2 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                            <span class="font-medium">Warning Badge</span>
                        </div>
                        <div class="flex items-center space-x-1.5 p-2 rounded-lg bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span>
                            <span class="font-medium">Critical Badge</span>
                        </div>
                    </div>
                </div>

                <!-- Placeholder for Home, Visits, Registers, Reports -->
                <div class="glass-card rounded-2xl p-8 text-center space-y-4 my-auto">
                    <div class="w-12 h-12 mx-auto rounded-full bg-slate-200/50 dark:bg-slate-800/50 flex items-center justify-center text-slate-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-1">Not Implemented Yet</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto">
                            The ${currentTab.toUpperCase()} section is scheduled for development in future milestones.
                        </p>
                    </div>
                    <div class="inline-flex items-center text-[11px] font-medium text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/50 px-3 py-1 rounded-full">
                        Milestone 1 Scope Placeholder
                    </div>
                </div>
            `;
        }

        // Toggle device frame layout (Mobile vs Tablet Rail)
        function setDeviceView(mode) {
            const container = document.getElementById('appContainer');
            const layoutWrapper = document.getElementById('layoutWrapper');
            const navRail = document.getElementById('navRail');
            const bottomNav = document.getElementById('bottomNav');
            const mobileBtn = document.getElementById('viewMobile');
            const tabletBtn = document.getElementById('viewTablet');

            if (mode === 'tablet') {
                container.classList.remove('max-w-sm', 'h-[740px]');
                container.classList.add('max-w-2xl', 'h-[600px]');
                layoutWrapper.classList.add('flex-row');
                navRail.classList.remove('hidden');
                navRail.classList.add('flex');
                bottomNav.classList.add('hidden');

                tabletBtn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white');
                tabletBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
                mobileBtn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white');
                mobileBtn.classList.add('text-slate-600', 'dark:text-slate-400');
            } else {
                container.classList.remove('max-w-2xl', 'h-[600px]');
                container.classList.add('max-w-sm', 'h-[740px]');
                layoutWrapper.classList.remove('flex-row');
                navRail.classList.add('hidden');
                navRail.classList.remove('flex');
                bottomNav.classList.remove('hidden');

                mobileBtn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white');
                mobileBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
                tabletBtn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white');
                tabletBtn.classList.add('text-slate-600', 'dark:text-slate-400');
            }
        }

        // Initialize default view
        window.onload = function() {
            applyAppearance('system');
            switchTab('home');
        };
    </script>
</body>
